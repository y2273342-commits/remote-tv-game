name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix project structure
        run: |
          # احتفظ بملف main.dart الأصلي
          cp lib/main.dart /tmp/main.dart || true
          # أنشئ مشروع فلاتر كامل جديد
          rm -rf android
          flutter create . --project-name remote_tv_game --platforms=android --org com.remote.tvgame
          # رجع ملفك الأصلي
          cp /tmp/main.dart lib/main.dart
          flutter pub get
      - name: Build APK and AAB for Play Store
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk-aab
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
